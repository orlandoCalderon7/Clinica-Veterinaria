<!-- src/app/features/historial/historial-form/historial-form.component.html -->

<div class="historial-form">

  <div class="form-header">
    <span class="material-icons-round">
      {{ esEdicion ? 'edit_note' : 'post_add' }}
    </span>
    <h2>{{ esEdicion ? 'Editar Consulta' : 'Nueva Consulta' }}</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="form-grid">

      <!-- ── Mascota ── -->
      <div class="form-group">
        <label>Mascota *</label>
        <select formControlName="mascotaId">
          <option [ngValue]="null" disabled>Selecciona una mascota</option>
          <option *ngFor="let m of mascotas" [ngValue]="m.id">
            {{ m.nombre }} — {{ m.especie }} ({{ m.raza }})
          </option>
        </select>
        <span class="error"
          *ngIf="campo('mascotaId')?.invalid && campo('mascotaId')?.touched">
          Selecciona una mascota
        </span>
      </div>

      <!-- ── Fecha ── -->
      <div class="form-group">
        <label>Fecha *</label>
        <input type="date" formControlName="fecha" />
        <span class="error"
          *ngIf="campo('fecha')?.invalid && campo('fecha')?.touched">
          Campo requerido
        </span>
      </div>

      <!-- ── Motivo ── -->
      <div class="form-group full">
        <label>Motivo de consulta *</label>
        <input type="text"
               formControlName="motivo"
               placeholder="Ej: Revisión anual" />
        <span class="error"
          *ngIf="campo('motivo')?.invalid && campo('motivo')?.touched">
          Campo requerido
        </span>
      </div>

      <!-- ── Diagnóstico ── -->
      <div class="form-group full">
        <label>Diagnóstico *</label>
        <textarea formControlName="diagnostico"
                  rows="3"
                  placeholder="Diagnóstico del veterinario...">
        </textarea>
        <span class="error"
          *ngIf="campo('diagnostico')?.invalid && campo('diagnostico')?.touched">
          Campo requerido
        </span>
      </div>

      <!-- ── Tratamiento ── -->
      <div class="form-group full">
        <label>Tratamiento *</label>
        <textarea formControlName="tratamiento"
                  rows="3"
                  placeholder="Tratamiento indicado...">
        </textarea>
        <span class="error"
          *ngIf="campo('tratamiento')?.invalid && campo('tratamiento')?.touched">
          Campo requerido
        </span>
      </div>

      <!-- ── Peso  se autocompleta al seleccionar mascota ── -->
      <div class="form-group">
        <label>
          Peso (kg) *
          <span class="badge-auto" *ngIf="pesoAutocompletado">
             cargado desde mascota
          </span>
        </label>
        <!--  FIX: sin min="0.1" en el HTML para evitar que el
             navegador rellene el campo con el mínimo automáticamente -->
        <input type="number"
               step="0.1"
               formControlName="peso"
               placeholder="Ej: 4.5" />
        <span class="error"
          *ngIf="campo('peso')?.invalid && campo('peso')?.touched">
          Peso válido requerido
        </span>
      </div>

      <!-- ── Temperatura ── -->
      <div class="form-group">
        <label>Temperatura (°C)</label>
        <input type="number"
               step="0.1"
               formControlName="temperatura"
               placeholder="Ej: 38.5" />
      </div>

      <!-- ── Veterinario  SELECT con opciones fijas ── -->
      <div class="form-group">
        <label>
          Veterinario *
          <span class="badge-auto vet" *ngIf="vetAutocompletado">
             cargado desde última cita
          </span>
        </label>
        <!--  FIX: cambiado de input a select igual que en citas -->
        <select formControlName="veterinario">
          <option [ngValue]="null" disabled>Seleccione un veterinario</option>
          <option value="Dr. García">Dr. García</option>
          <option value="Dra. López">Dra. López</option>
          <option value="Dr. Mendez">Dr. Mendez</option>
          <option value="Estilista: Sofía">Estilista: Sofía</option>
        </select>
        <span class="error"
          *ngIf="campo('veterinario')?.invalid && campo('veterinario')?.touched">
          Selecciona un veterinario
        </span>
      </div>

      <!-- ── Observaciones ── -->
      <div class="form-group full">
        <label>Observaciones</label>
        <textarea formControlName="observaciones"
                  rows="2"
                  placeholder="Notas adicionales...">
        </textarea>
      </div>

    </div>

    <!-- ── Botones ── -->
    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="cancelar()">
        <span class="material-icons-round">close</span> Cancelar
      </button>
      <button type="submit" class="btn-save" [disabled]="guardando">
        <span class="material-icons-round" [class.spin]="guardando">
          {{ guardando ? 'autorenew' : 'save' }}
        </span>
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>

  </form>

</div>
